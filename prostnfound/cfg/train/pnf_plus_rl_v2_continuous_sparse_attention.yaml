# ProstNFound-RL V2 - Sparse Attention Reward
# This is designed to fix the "inverted attention" problem
# 
# Key insight: The model was attending MORE to benign cases than cancer cases!
# This reward mode uses ASYMMETRIC treatment:
# - BENIGN (inv=0): STRONGLY penalize high attention (reward = 1 - 2*attention)
# - CANCER (inv>0): Use classification reward + small attention bonus
#
# This directly enforces:
# - Low attention for benign → gets positive reward
# - High attention for benign → gets STRONG negative reward
# - Cancer cases: classification-driven with allowed attention

name: "PNF-RL-V2-continuous-sparse_attention-GRPO"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 16
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration - V2 with continuous attention
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 use_clinical_in_policy: true
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false
 upsample: false
 boundary_tolerance_patches: 2

# Loss configuration
loss: mil_prop_bce_entropy_reg
outside_prostate_penalty: false
add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# RL configuration
use_rl: true
rl_mode: grpo

# Reward configuration - SPARSE ATTENTION (Fixes inverted attention)
# This reward mode uses ASYMMETRIC treatment:
# - BENIGN: reward = 1 - 2*mean_attention (strongly penalizes high attention)
# - CANCER: classification reward + attention bonus
rl_reward_mode: sparse_attention
rl_cspca_bonus: 2.0

# Within-image comparison
rl_num_samples_per_image: 4

# GRPO hyperparameters - TUNED FOR SPARSE ATTENTION
rl_num_update_epochs: 3  # More updates for clearer signal
rl_clip_eps: 0.1
rl_entropy_coef: 0.001  # REDUCED: Less exploration, more exploitation
rl_kl_coef: 0.01
rl_max_grad_norm: 0.25
rl_loss_weight: 1.0  # Full RL signal
rl_value_coef: 0.5

# Benign Sparsity Penalty - ADDITIONAL penalty on top of sparse_attention
# This can be 0 since sparse_attention already handles benign cases
rl_benign_sparsity_penalty_weight: 0.0

# Optimizer configuration
optimizer: adamw
lr: 2.0e-05
encoder_lr: 8.0e-06
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.01
epochs: 50  # More epochs for attention pattern learning
accumulate_grad_steps: 1
cutoff_epoch: null
scheduler: cosine

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_rl_v2
seed: 30
tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v2/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
