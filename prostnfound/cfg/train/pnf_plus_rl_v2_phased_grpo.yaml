# ProstNFound-RL V2 - PHASED TRAINING (Supervised Warmup + GRPO Fine-tuning)
# 
# This config implements the RLHF-style training approach with GRPO:
# Phase 1 (Supervised): Train with standard supervised loss for warmup epochs
#                       This establishes a good baseline attention mechanism
# Phase 2 (RL Fine-tuning): Then switch to GRPO training to refine the policy
#
# GRPO vs PPO:
# - GRPO: No value function, simpler, works well for simpler reward structures
# - PPO: Value function baseline, can be more stable for complex rewards

name: "GRPO-PHASED10-suprl30"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 16
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration - V2 with continuous attention
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 512
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false  # GRPO does not use value function
 upsample: false
 boundary_tolerance_patches: 1

# Loss configuration
loss: mil_prop_bce_entropy_reg
add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# RL configuration
use_rl: true
rl_mode: grpo  # GRPO instead of PPO

# =============================================================================
# PHASED TRAINING CONFIGURATION
# =============================================================================
rl_supervised_warmup_epochs: 10  # Phase 1: 5 epochs supervised warmup
rl_lr_restart: true  # Restart LR schedule when switching to RL phase
rl_lr_factor: 0.5  # Use 50% of base LR during RL phase

# Decoder constraints
decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

# Reward configuration
rl_reward_mode: classification_only
rl_cspca_bonus: 2

# GRPO-specific: samples per image
rl_num_samples_per_image: 8

# GRPO hyperparameters (no value function)
rl_num_update_epochs: 4  # GRPO typically uses fewer updates
rl_clip_eps: 0.2
rl_entropy_coef: 0.04  # Standard entropy for GRPO
rl_kl_coef: 0.01  # GRPO uses KL penalty
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0
# rl_value_coef not used in GRPO

# Benign Sparsity Penalty
rl_benign_sparsity_penalty_weight: 0.0

# Optimizer configuration
optimizer: adamw
lr: 2.0e-05
encoder_lr: 8.0e-06
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.01
epochs: 40  # Total: 5 supervised + 35 GRPO
accumulate_grad_steps: 1
cutoff_epoch: null
scheduler: cosine

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_rl_v2
seed: 30
tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v2/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
