# ProstNFound-RL V2 - Hierarchical Gated Reward with PPO
# Based on best model settings, with SPARSE REWARD tuning
# 
# HIERARCHICAL REWARD STRUCTURE:
# Gate 1: Classification must be correct
#   - Wrong classification → -1 (strong negative)
# Gate 2: Attention quality (only if classification correct)
#   - Benign + low attention → +1
#   - Benign + high attention → 0
#   - Cancer + high attention → +1
#   - Cancer + low attention → 0
#
# This creates SPARSE but CLEAR rewards, requiring more exploration.
# Hyperparameters tuned for sparse reward learning.

name: "PNF-RL-V2-continuous-hierarchical_gated-PPO-BalancedLoss-8Samples"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 16
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 use_clinical_in_policy: true
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false
 use_value_function: true  # PPO requires value function
 upsample: false
 boundary_tolerance_patches: 2

# Loss configuration
loss: mil_prop_bce_entropy_reg
outside_prostate_penalty: false
add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# RL configuration
use_rl: true
rl_mode: ppo

# === REWARD: HIERARCHICAL GATED ===
# Sparse but clear: +1 when BOTH correct classification AND appropriate attention
# -1 when classification wrong, 0 when classification right but attention wrong
rl_reward_mode: hierarchical_gated
rl_cspca_bonus: 2.0

# === HYPERPARAMETERS TUNED FOR SPARSE REWARDS ===

# MORE SAMPLES: Need more exploration when rewards are sparse
rl_num_samples_per_image: 8

# MORE EPOCHS: Sparse rewards need more gradient updates to learn
rl_num_update_epochs: 6  # Increased from 4

# HIGHER ENTROPY: More exploration to discover sparse rewards
rl_entropy_coef: 0.03  # Increased from 0.01 - encourages exploration

# LARGER CLIP: Allow bigger policy updates when we find good actions
rl_clip_eps: 0.3  # Increased from 0.2

# STANDARD KL: Not needed for sparse rewards
rl_kl_coef: 0.0

# LOWER GRAD NORM: More stable with sparse rewards
rl_max_grad_norm: 0.3  # Slightly reduced

# FULL RL WEIGHT
rl_loss_weight: 1.0

# VALUE FUNCTION: Important for baseline with sparse rewards
rl_value_coef: 0.75  # Increased from 0.5 - better baseline estimation

# No benign sparsity penalty - hierarchical reward handles it
rl_benign_sparsity_penalty_weight: 0.0

# === OPTIMIZER: SLIGHTLY HIGHER LR FOR SPARSE REWARDS ===
optimizer: adamw
lr: 3.0e-05  # Slightly increased
encoder_lr: 1.0e-05  # Slightly increased
warmup_lr: 5.0e-05
cnn_lr: 1.5e-05  # Slightly increased
warmup_epochs: 2  # Longer warmup
wd: 0.01
epochs: 50  # More epochs for sparse rewards
accumulate_grad_steps: 1
cutoff_epoch: null
scheduler: cosine

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_rl_v2
seed: 30
tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v2/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
