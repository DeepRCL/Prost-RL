# =============================================================================
# Config 1: SUPERVISED BASELINE (no RL)
# =============================================================================
#
# Same architecture as the PPO model but use_rl: false.
# Attention is trained ONLY through supervised gradient flowing through decoder.
#
# Hyperparameters match APO-fixed (the winner).
# Paper story: baseline showing what supervised training alone can achieve.
# =============================================================================

name: "PPO-supervised-baseline"

data:
  fold: 0
  n_folds: 5
  test_center: null
  exclude_benign_cores_from_positive_patients: true
  involvement_threshold_pct: null
  undersample_benign_ratio: null
  cohort_selection_mode: kfold
  dataset: default
  batch_size: 8
  num_workers: 8
  train_subsample_seed: 42
  augmentations: translate
  image_size: 256
  first_downsample_size: null
  mask_size: 64
  limit_train_data: null
  mean: [0, 0, 0]
  std: [1, 1, 1]
  flip_ud: false
  frames: first
  crop_to_prostate: false
  rf_as_bmode: false
  include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
  prompts: [age, psa, psad, pos]
  use_clinical_in_policy: true
  use_class_decoder: true
  num_attention_patches: 4
  policy_hidden_dim: 256
  freeze_prostnfound: false
  use_prostate_mask_constraint: true
  attention_mode: continuous
  use_value_function: false
  upsample: false
  boundary_tolerance_patches: 1      # Match APO-fixed
  detach_attention_for_decoder: false
  continuous_noise_scale: 0

loss: symmetric_ce_entropy_reg
loss_kw:
  alpha: 1.0
  beta: 1.0
  epsilon: 1e-4

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# NO RL
use_rl: false

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05                  # Match APO-fixed
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001                            # Match APO-fixed
epochs: 35
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/core_auc_high_involvement

wandb:
  mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
  log_images: false
  log_images_every: 100
