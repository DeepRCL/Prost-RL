# =============================================================================
# APO (Adaptive Policy Optimization) — DRPO with Decoupled Training
# =============================================================================
#
# This is the architecturally correct way to combine DRPO with rollout diversity.
#
# Root cause analysis showed 4 bugs in the previous DRPO configs:
#   1. Supervised loss was computed on ALL diverse rollouts (B*4 samples),
#      creating conflicting decoder gradients (different attention → different
#      decoder output → same ground truth = gradient conflict)
#   2. Supervised loss was amplified 4× in the multi-epoch PPO loop
#   3. Continuous noise mode had broken action replay (fixed in code)
#   4. classification_only with DRPO wasted the attention reward component
#
# This config fixes all issues via DECOUPLED TRAINING:
#   Phase 1: Supervised loss on ONE deterministic forward pass (B samples)
#            → decoder always sees the same attention → stable training
#   Phase 2: RL loss on diverse Bernoulli rollouts (B*4 samples)
#            → DRPO gets genuine within-image reward variance
#            → Only policy gradient flows, no supervised loss on rollouts
#
# Bernoulli was chosen over continuous+noise because:
#   - Bernoulli has proper action replay (saves binary mask)
#   - Bernoulli log_prob naturally depends on policy parameters (sigmoid)
#   - Bernoulli produces structurally different attention patterns (not just
#     softmax perturbations), giving more reward variance for DRPO
#
# combined_v2 reward is used (not classification_only) so DRPO has TWO
# meaningful reward components for its decoupled normalization.
# =============================================================================

name: "V3-APO-DRPO-decoupled-bernoulli"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 attention_mode: bernoulli          # Bernoulli gives structured diversity for DRPO
 use_value_function: false          # DRPO uses group-normalized advantages, not value baseline
 upsample: false
 boundary_tolerance_patches: 1
 detach_attention_for_decoder: false  # Supervised gradient also trains attention policy
 bernoulli_pool_stride: 1           # Full 16x16 grid

# Noise-robust loss for weak labels: symmetric CE is more robust than thresholded
loss: symmetric_ce_entropy_reg
loss_kw:
  alpha: 1.0
  beta: 1.0
  epsilon: 1e-4

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# RL configuration
use_rl: true
rl_mode: drpo
rl_decoupled_training: true         # KEY: Use decoupled training loop

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

# Combined reward: gives DRPO two meaningful components
rl_reward_mode: combined_v2
rl_heatmap_reward_weight: 0.5
rl_classification_reward_weight: 0.5
rl_cspca_bonus: 2

# DRPO: 4 rollouts × 4 update epochs
rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0                 # RL weight relative to supervised

# DRPO hyperparameters
drpo_reward_weights: [1.0, 1.0]     # Equal weight classification and ROI
drpo_num_clusters: 3
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

rl_benign_sparsity_penalty_weight: 0.0

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 30
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/combined_high_inv_auc

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
