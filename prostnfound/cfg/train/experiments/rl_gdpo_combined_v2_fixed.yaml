# =============================================================================
# ProstNFound-RL - GDPO with combined_v2 (FIXED)
# =============================================================================
# 
# This tests GDPO's true capability: decoupled normalization for multi-reward
# 
# Key fixes from previous broken configs:
# 1. REMOVED detach_attention_for_decoder (was breaking gradient flow!)
# 2. Set rl_*_reward_weight to 1.0 (let GDPO handle weighting post-normalization)
# 3. Matched hyperparameters to working config
# 4. Added scheduler: cosine
#
# GDPO should help when:
# - Classification reward and attention reward have different scales/variances
# - One reward dominates the other in standard GRPO
#
# =============================================================================

name: "V4-GDPO-combined_v2-FIXED"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 16  # Same as working config
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration - MATCHES working config
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false  # GDPO does not use value function
 upsample: false
 boundary_tolerance_patches: 1  # Same as working config
 # NOTE: NOT setting detach_attention_for_decoder - let gradients flow!

# Loss configuration - same as working config
loss: mil_prop_bce_entropy_reg
decoder_prostate_mask_constraint: true
outside_prostate_penalty: false
add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# =============================================================================
# RL CONFIGURATION - GDPO MODE with combined_v2
# =============================================================================
use_rl: true
rl_mode: gdpo  # GDPO with decoupled reward normalization

# Reward configuration - combined_v2 for multi-reward GDPO
# IMPORTANT: Set to 1.0 to avoid double-weighting!
# Let GDPO handle weighting AFTER normalization via gdpo_reward_weights
rl_reward_mode: combined_v2
rl_heatmap_reward_weight: 1.0      # No pre-normalization weighting
rl_classification_reward_weight: 1.0  # No pre-normalization weighting
rl_cspca_bonus: 2

# GDPO weights - applied AFTER each component is normalized
# [classification_weight, attention_weight]
# Equal weights to start - GDPO will preserve both signals
gdpo_reward_weights: [1.0, 1.0]

# Hyperparameters - MATCHED to working config
rl_num_samples_per_image: 4
rl_num_update_epochs: 2        # Working config uses 2
rl_clip_eps: 0.1               # Working config uses 0.1
rl_entropy_coef: 0.005         # Working config uses 0.005
rl_kl_coef: 0.01
rl_max_grad_norm: 0.25         # Working config uses 0.25
rl_loss_weight: 0.8            # Working config uses 0.8
rl_value_coef: 0.5

# Benign Sparsity Penalty 
rl_benign_sparsity_penalty_weight: 0.0

# =============================================================================
# OPTIMIZER CONFIGURATION - MATCHED to working config
# =============================================================================
optimizer: adamw
lr: 2.0e-05
encoder_lr: 8.0e-06            # Working config value
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.01                       # Working config uses 0.01
epochs: 30                     # Same as working
accumulate_grad_steps: 1
cutoff_epoch: null
scheduler: cosine              # Working config has this

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_rl_comparison
seed: 30

tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v4/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
