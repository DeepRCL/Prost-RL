# =============================================================================
# ProstNFound-RL — Bernoulli Coarse-Grid (8×8=64 patches, fixed gradient)
# =============================================================================
#
# Root-cause analysis of why all previous Bernoulli runs had uniform attention:
#
# BUG 1 — log_prob mean diluted gradients by 256×
#   Old: log_prob = dist.log_prob(mask).mean()   → gradient per logit = 1/256
#   New: log_prob = dist.log_prob(mask).sum() / sqrt(256)
#   → each spatial logit now receives sqrt(256)=16× stronger policy gradient
#
# BUG 2 — 256 independent Bernoulli variables, scalar reward
#   With 256 patches all near p=0.5, any random 50% subset gives essentially
#   the same decoder output → same reward → advantage ≈ 0 → no learning.
#   Fix: bernoulli_pool_stride: 2 → 8×8 = 64 variables instead of 256.
#   • 4× fewer variables → 4× stronger gradient per variable (on top of Bug 1 fix)
#   • Each coarse patch covers a 2×2 fine-patch region → selecting/deselecting
#     it has a more visible effect on the decoder → non-zero reward variance
#   • At inference, coarse mask is upsampled bilinearly → smooth modulation
#
# BUG 3 — entropy coefficient still competing with fixed gradient
#   Reduced to 0.0: with gradient starvation fixed, entropy regularisation is
#   no longer needed to prevent mode collapse; it was causing collapse.
#
# Expected result: attention entropy_mean drops from 0.88 toward 0.6-0.7,
# attention_contrast becomes positive, attention_auroc > 0.5.
# =============================================================================

name: "V3-DRPO-bernoulli-coarse-grid"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 attention_mode: bernoulli
 use_value_function: false
 upsample: false
 boundary_tolerance_patches: 1
 detach_attention_for_decoder: false
 bernoulli_pool_stride: 2   # 16×16 → 8×8 = 64 Bernoulli variables (was 256)

loss: thresholded_involvement_entropy_reg
loss_kw:
  threshold: 0.5
  soft_temperature: 0.1

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

use_rl: true
rl_mode: drpo

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

rl_reward_mode: classification_only
rl_cspca_bonus: 2

rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.0   # removed: was trapping policy at max entropy
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

drpo_reward_weights: [1.0, 1.0]
drpo_num_clusters: 3
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

rl_benign_sparsity_penalty_weight: 0.0

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 20
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/combined_high_inv_auc

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
