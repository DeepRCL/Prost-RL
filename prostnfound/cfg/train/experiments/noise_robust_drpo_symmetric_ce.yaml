# =============================================================================
# ProstNFound-RL V3 - DRPO with Symmetric Cross Entropy Loss
# =============================================================================
# 
# This config combines:
# 1. RL (DRPO) for learning attention patterns with hierarchical scaling
# 2. Symmetric Cross Entropy for noise-robust supervision
#
# DRPO = GDPO + domain clustering + temperature scaling
# - Balances learning across rare/hard samples (e.g., cancer cases)
# - Uses combined_v2 reward to leverage GDPO's multi-reward normalization
#
# =============================================================================

name: "V3-DRPO-symmetric_ce"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration - V2 with continuous attention
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false  # DRPO uses GRPO (no value function)
 upsample: false
 boundary_tolerance_patches: 2
 detach_attention_for_decoder: false

# =============================================================================
# LOSS: Symmetric Cross Entropy (noise-robust from DivideMix paper)
# =============================================================================
loss: symmetric_ce_entropy_reg
loss_kw:
  alpha: 1.0    # Standard CE weight
  beta: 1.0     # Reverse CE weight (higher = more noise-robust)
  epsilon: 1e-4

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# =============================================================================
# RL CONFIGURATION (DRPO)
# =============================================================================
use_rl: true
rl_mode: drpo  # DRPO = GDPO + hierarchical advantage scaling

# Use HARD mask constraint for decoder (matches RL attention constraint)
decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

# Reward: combined_v2 to leverage GDPO's multi-reward decoupled normalization
# classification + ROI involvement = 2 reward components for GDPO to normalize separately
rl_reward_mode: classification_only
rl_cspca_bonus: 2

# DRPO hyperparameters (extends GDPO, based on GRPO)
rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

# DRPO-specific: hierarchical advantage scaling
drpo_reward_weights: [1.0, 1.0]  # Weights for [classification, attention/ROI] rewards
drpo_num_clusters: 5              # Number of difficulty clusters per domain
drpo_epsilon: 1.0e-4              # Small constant to prevent division by zero
drpo_strict_mode: true            # Raise errors if DRPO fallback occurs

# Benign Sparsity Penalty (encourages low attention for benign cases)
rl_benign_sparsity_penalty_weight: 0.0

# =============================================================================
# OPTIMIZER CONFIGURATION
# =============================================================================
optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 35
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
