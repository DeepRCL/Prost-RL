# =============================================================================
# ABLATION A: Continuous attention + Gaussian noise rollouts (proper GRPO)
# =============================================================================
#
# Root cause of the problem:
#   Continuous mode currently uses -entropy as log_prob.
#   GRPO ratio = exp(-entropy_new + entropy_old) → not a policy ratio.
#   All 4 rollouts are identical → advantage = 0 → GRPO does nothing.
#   The model works only because the supervised loss trains attention.
#
# This fix:
#   continuous_noise_scale: 0.3
#   During each rollout, Gaussian noise N(0, 0.3^2) is added to logits
#   before softmax.  Different rollouts → genuinely different attention maps
#   → different rewards → non-zero GRPO advantages.
#
#   log_prob = -0.5 * ||noise||^2 / sigma^2  (valid Gaussian log-prob)
#   GRPO ratio = exp(log_p_new - log_p_old) is now meaningful.
#
#   At inference (deterministic=True): noise is OFF, clean softmax used.
#   Old continuous-mode models (noise_scale=0): completely unchanged.
#
# Noise scale 0.3 chosen so noise std is comparable to logit spread
# (logits are typically in [-3, 3] range before masking).
# =============================================================================

name: "V3-DRPO-continuous-noise-0.3"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 attention_mode: continuous
 use_value_function: false
 upsample: false
 boundary_tolerance_patches: 1
 detach_attention_for_decoder: false
 continuous_noise_scale: 0.3   # Gaussian noise on logits → genuine rollout diversity

loss: thresholded_involvement_entropy_reg
loss_kw:
  threshold: 0.5
  soft_temperature: 0.1

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

use_rl: true
rl_mode: drpo

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

rl_reward_mode: classification_only
rl_cspca_bonus: 2

rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

drpo_reward_weights: [1.0, 1.0]
drpo_num_clusters: 3
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

rl_benign_sparsity_penalty_weight: 0.0

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 30
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/combined_high_inv_auc

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
