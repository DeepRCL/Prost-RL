# =============================================================================
# ProstNFound-RL — Bernoulli Score-Weighted, tracked on core_auc_image_level_cspca
# =============================================================================
#
# Identical to bernoulli_drpo_score_weighted.yaml with ONE change:
#
#   tracked_metric: val/core_auc_image_level_cspca
#
# Why this is the right metric for "classification head on important cases":
#
#   • Uses the IMAGE-LEVEL CLASSIFICATION HEAD output (not heatmap averages).
#     The classification head is a dedicated learned module that outputs a
#     single cancer/benign score per image — this is the pure classifier.
#
#   • _cspca suffix = AUC computed as GG > 2 (Grade Group 3+, csPCa) vs benign.
#     GG3+ cases are the clinically significant, high-grade, high-involvement
#     cases you care about. This is the closest proxy to "high-involvement"
#     that the classification head provides (grade and involvement are correlated).
#
#   Note: a _high_involvement variant for the image-level head does not exist
#   in the evaluator — the _high_involvement suffix is only computed for
#   heatmap-based metrics. core_auc_image_level_cspca is the correct substitute.
#
#   Comparison of tracked metric choices:
#   ┌──────────────────────────────────────┬───────────────────────────────────────┐
#   │ core_auc_high_involvement            │ core_auc_image_level_cspca            │
#   ├──────────────────────────────────────┼───────────────────────────────────────┤
#   │ heatmap avg inside needle            │ classification HEAD output            │
#   │ involvement > 40% + benign           │ GG > 2 vs benign+GG≤2                │
#   │ tracks spatial heatmap quality       │ tracks classifier directly            │
#   └──────────────────────────────────────┴───────────────────────────────────────┘
# =============================================================================

name: "V3-DRPO-bernoulli-image-level-cspca"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 attention_mode: bernoulli
 use_value_function: false
 upsample: false
 boundary_tolerance_patches: 1
 detach_attention_for_decoder: false

loss: thresholded_involvement_entropy_reg
loss_kw:
  threshold: 0.5
  soft_temperature: 0.1

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

use_rl: true
rl_mode: drpo

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

rl_reward_mode: classification_only
rl_cspca_bonus: 2

rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

drpo_reward_weights: [1.0, 1.0]
drpo_num_clusters: 3
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

rl_benign_sparsity_penalty_weight: 0.0

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 30
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/core_auc_image_level_cspca

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
