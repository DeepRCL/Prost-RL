# =============================================================================
# ProstNFound-RL V3 - DRPO (Improved) with Thresholded Involvement Loss
# =============================================================================
# 
# KEY IMPROVEMENTS over noise_robust_drpo.yaml:
#
# 1. REWARD MODE: combined_v2 instead of classification_only
#    - classification_only gives only 1 reward component, so
#      GDPO's decoupled normalization is wasted (nothing to decouple!)
#    - combined_v2 gives 2 components: classification + ROI involvement
#    - Now GDPO normalizes each reward stream independently before combining,
#      and DRPO's hierarchical scaling is applied on top
#
# 2. REWARD WEIGHTS: [1.5, 0.5] - classification-dominant
#    - Classification reward is more important for final accuracy
#    - ROI reward provides attention guidance signal
#    - GDPO normalizes each before weighting, so scale differences are handled
#
# 3. CLUSTERS: 3 instead of 5
#    - With batch_size=8 (often 5-6 benign, 2-3 cancer per batch),
#      5 clusters per domain may overfit to batch composition
#    - 3 clusters = {easy, medium, hard} is more stable
#
# =============================================================================

name: "V3-DRPO-combined-thresholded"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration - V2 with continuous attention
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false  # DRPO uses GRPO (no value function)
 upsample: false
 boundary_tolerance_patches: 2
 detach_attention_for_decoder: false

# =============================================================================
# LOSS: Thresholded Involvement with Entropy Regularization
# =============================================================================
loss: thresholded_involvement_entropy_reg
loss_kw:
  threshold: 0.5
  soft_temperature: 0.1

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# =============================================================================
# RL CONFIGURATION (DRPO - Improved)
# =============================================================================
use_rl: true
rl_mode: drpo  # DRPO = GDPO + hierarchical advantage scaling

# Use HARD mask constraint for decoder (matches RL attention constraint)
decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

# CRITICAL: Use combined_v2 for multi-reward GDPO normalization!
# classification_only = 1 component = GDPO has nothing to decouple
# combined_v2 = 2 components (classification + ROI) = GDPO actually works
rl_reward_mode: combined_v2
rl_cspca_bonus: 2

# DRPO hyperparameters (extends GDPO, based on GRPO)
rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

# DRPO-specific: hierarchical advantage scaling
# Classification-dominant weighting since ROI is a guidance signal
drpo_reward_weights: [1.5, 0.5]
# 3 clusters (easy/medium/hard) - more stable than 5 with small batches
drpo_num_clusters: 3
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

# Benign Sparsity Penalty (encourages low attention for benign cases)
rl_benign_sparsity_penalty_weight: 0.0

# =============================================================================
# OPTIMIZER CONFIGURATION
# =============================================================================
optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 35
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
