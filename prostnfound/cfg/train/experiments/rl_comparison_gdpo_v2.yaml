# =============================================================================
# ProstNFound-RL Comparison - GDPO (NEW)
# =============================================================================
# 
# GDPO (Group reward-Decoupled normalization Policy Optimization)
# Based on: https://arxiv.org/abs/2601.05242
#
# This is the KEY innovation for multi-reward RL training!
#
# Problem with GRPO in multi-reward settings:
# - GRPO sums rewards first, then normalizes across the group
# - This can cause "reward advantages collapse" where one reward dominates
#   or rewards cancel each other out, reducing training signal resolution
#
# GDPO Solution:
# - Normalizes EACH reward signal SEPARATELY within the group
# - Then sums the normalized advantages with weights
# - Final batch-level normalization for stable training
#
# For ProstNFound-RL:
# - Reward 1: Classification performance (how well model classifies cancer)
# - Reward 2: Attention/ROI performance (how well attention matches involvement)
#
# GDPO ensures both signals contribute meaningfully, preventing one from
# dominating the training process. This is crucial for learning:
# 1. Good classification (clinical task)
# 2. Sparse/accurate attention (interpretability)
#
# =============================================================================

name: "V4-GDPO-combined_v2-thresholded_involvement_entropy_reg-6roll"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false  # GDPO typically doesn't use value function
 upsample: false
 boundary_tolerance_patches: 2
 detach_attention_for_decoder: true

# =============================================================================
# LOSS CONFIGURATION
# =============================================================================
# Using symmetric CE as the noise-robust loss (best from your results)
loss: thresholded_involvement_entropy_reg
loss_kw:
  alpha: 1.0    # Standard CE weight
  beta: 1.0     # Reverse CE weight

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# =============================================================================
# RL CONFIGURATION - GDPO MODE (KEY DIFFERENCE)
# =============================================================================
use_rl: true
rl_mode: gdpo  # Group reward-Decoupled normalization Policy Optimization

# Use HARD mask constraint for decoder
decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

# Reward configuration - combined_v2 gives us two reward signals
# GDPO will normalize EACH signal separately before combining!
rl_reward_mode: combined_v2
rl_heatmap_reward_weight: 1
rl_classification_reward_weight: 1
rl_cspca_bonus: 2

# GDPO-specific: weights for each reward component after normalization
# [classification_weight, attention_weight]
# Equal weights by default, but you can tune:
# - Higher classification_weight → prioritize classification accuracy
# - Higher attention_weight → prioritize attention calibration
gdpo_reward_weights: [0.5, 1.5]

# GDPO hyperparameters (similar to GRPO, no value function)
rl_num_samples_per_image: 6
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.01  # KL penalty for stability
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

# Benign Sparsity Penalty (disabled for fair comparison)
rl_benign_sparsity_penalty_weight: 0.0

# =============================================================================
# OPTIMIZER CONFIGURATION
# =============================================================================
optimizer: adamw
lr: 6.0e-05
encoder_lr: 2.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0
epochs: 30
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_rl_comparison
seed: 30

# Track high involvement performance (relevant for csPCa detection)
tracked_metric: val/core_auc

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v4/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
