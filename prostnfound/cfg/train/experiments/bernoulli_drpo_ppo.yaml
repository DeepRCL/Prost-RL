# =============================================================================
# ProstNFound-RL — Bernoulli GRPO + Value Function (PPO-style)
# =============================================================================
#
# Difference from DRPO/GRPO:
#   use_value_function: true
#   → Adds a learned value network V(features, clinical) that predicts expected reward.
#   → Advantage = reward - V(s) instead of reward - mean(group_rewards).
#   → Value function generalises across batches and epochs, giving a much more
#     stable baseline than within-group mean normalisation.
#   → This is the standard PPO improvement: lower variance, more consistent
#     gradient direction.
#
# Why this might outperform pure DRPO:
#   • GRPO/DRPO baseline = mean reward of the current mini-batch group.
#     If the group is small or homogeneous, the baseline is noisy.
#   • PPO baseline = learned value from ALL past experience → more stable.
#   • Especially helpful here because Bernoulli action space produces high
#     reward variance — a learned baseline absorbs this variance.
#
# rl_mode stays 'drpo' to keep hierarchical advantage scaling between
# cancer/benign groups; value function adds on top as the per-sample baseline.
#
# Also includes score-weighted modulation fix and boundary_tolerance_patches: 1.
# =============================================================================

name: "V3-DRPO-bernoulli-ppo"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 8
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_clinical_in_policy: true
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 attention_mode: bernoulli
 use_value_function: true   # ← enables learned value baseline (PPO-style)
 upsample: false
 boundary_tolerance_patches: 1
 detach_attention_for_decoder: false

loss: thresholded_involvement_entropy_reg
loss_kw:
  threshold: 0.5
  soft_temperature: 0.1

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

use_rl: true
rl_mode: drpo

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

rl_reward_mode: classification_only
rl_cspca_bonus: 2

rl_num_samples_per_image: 4
rl_num_update_epochs: 4
rl_clip_eps: 0.2
rl_entropy_coef: 0.01   # 0.05 caused entropy collapse — all probs stuck at p≈0.5
rl_kl_coef: 0.0
rl_value_coef: 0.5     # weight of value function loss relative to policy loss
rl_max_grad_norm: 0.5
rl_loss_weight: 1.0

drpo_reward_weights: [1.0, 1.0]
drpo_num_clusters: 5
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

rl_benign_sparsity_penalty_weight: 0.0

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 30
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v3/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
