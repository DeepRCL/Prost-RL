# Prost-RL EXP4: supervised warm-up checkpoint + DRPO pairwise-ranking fine-tuning.
# See README.md for the full cross-validation command table.

name: "EXP4-pairwise-ranking-rl-fold0-v2"

data:
  fold: 0
  n_folds: 5
  test_center: null
  exclude_benign_cores_from_positive_patients: true
  involvement_threshold_pct: null
  undersample_benign_ratio: null
  cohort_selection_mode: kfold
  dataset: default
  batch_size: 16
  num_workers: 8
  train_subsample_seed: 42
  augmentations: translate
  image_size: 256
  first_downsample_size: null
  mask_size: 64
  limit_train_data: null
  mean: [0, 0, 0]
  std: [1, 1, 1]
  flip_ud: false
  frames: first
  crop_to_prostate: false
  rf_as_bmode: false
  include_rf: false

model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
  prompts: [age, psa, psad, pos]
  use_clinical_in_policy: true
  use_class_decoder: true
  num_attention_patches: 4
  policy_hidden_dim: 256
  freeze_prostnfound: false
  use_prostate_mask_constraint: true
  attention_mode: continuous
  use_value_function: false
  upsample: false
  boundary_tolerance_patches: 1
  detach_attention_for_decoder: false
  continuous_noise_scale: 0.15

loss: symmetric_ce_entropy_reg
loss_kw:
  alpha: 1.0
  beta: 1.0
  epsilon: 1e-4

add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

use_rl: true
rl_mode: drpo

decoder_prostate_mask_constraint: true
outside_prostate_penalty: false

rl_reward_mode: pairwise_ranking
rl_cspca_bonus: 2

rl_num_samples_per_image: 4
rl_num_update_epochs: 1
rl_clip_eps: 0.2
rl_entropy_coef: 0.01
rl_kl_coef: 0.0
rl_max_grad_norm: 0.5
rl_loss_weight: 0.8

drpo_reward_weights: [1.0, 1.0]
drpo_num_clusters: 3
drpo_epsilon: 1.0e-4
drpo_strict_mode: true

rl_benign_sparsity_penalty_weight: 0.0

optimizer: adamw
lr: 2.0e-05
encoder_lr: 1.0e-05
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.001
epochs: 35
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_noise_robust
seed: 30

tracked_metric: val/core_auc_high_involvement

wandb:
  mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_supervised_cv/${name}
model_checkpoint: ../checkpoints_supervised_cv/PPO-supervised-baseline-fold0/best_rl.pth
debug: false
save_best_weights: true

evaluator:
  log_images: false
  log_images_every: 100
