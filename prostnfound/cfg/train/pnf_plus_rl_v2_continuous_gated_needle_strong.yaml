# ProstNFound-RL V2 - Classification-Gated Needle Reward with Benign Penalty
# This is the STRONGEST configuration for sparse benign attention
# 
# Key features:
# 1. classification_gated_needle: Only reward when classification correct + needle attention ~ involvement
# 2. benign_sparsity_penalty: Additional explicit penalty for high attention in benign cases
# 3. Reduced entropy coefficient: Less exploration = more exploitation of learned patterns

name: "PNF-RL-V2-continuous-gated_needle_strong-GRPO"

data:
 fold: 0
 n_folds: 5
 test_center: null
 exclude_benign_cores_from_positive_patients: true
 involvement_threshold_pct: null
 undersample_benign_ratio: null
 cohort_selection_mode: kfold
 dataset: default
 batch_size: 16
 num_workers: 8
 train_subsample_seed: 42
 augmentations: translate
 image_size: 256
 first_downsample_size: null
 mask_size: 64
 limit_train_data: null
 mean: [0, 0, 0]
 std: [1, 1, 1]
 flip_ud: false
 frames: first
 crop_to_prostate: false
 rf_as_bmode: false
 include_rf: false

# Model configuration - V2 with continuous attention
model: prostnfound_rl_v2_adapter_medsam_legacy
model_kw:
 prompts: [age, psa, psad, pos]
 use_class_decoder: true
 num_attention_patches: 4
 policy_hidden_dim: 256
 use_clinical_in_policy: true
 freeze_prostnfound: false
 use_prostate_mask_constraint: true
 discrete_attention: false  # Continuous attention
 use_value_function: false
 upsample: false
 boundary_tolerance_patches: 2

# Loss configuration
loss: mil_prop_bce_entropy_reg
outside_prostate_penalty: false
add_image_clf: true
image_clf_mode: cspca
image_clf_class_weight: balanced

# RL configuration
use_rl: true
rl_mode: grpo

# Reward configuration - CLASSIFICATION GATED NEEDLE (NEW)
rl_reward_mode: classification_gated_needle
rl_cspca_bonus: 2.0

# Within-image comparison
rl_num_samples_per_image: 4

# GRPO hyperparameters - TUNED FOR SPARSE ATTENTION
rl_num_update_epochs: 3  # More updates per batch
rl_clip_eps: 0.1
rl_entropy_coef: 0.001  # REDUCED: Less exploration, more exploitation
rl_kl_coef: 0.01
rl_max_grad_norm: 0.25
rl_loss_weight: 1.0  # INCREASED: Stronger RL signal
rl_value_coef: 0.5

# CRITICAL: Benign Sparsity Penalty - ENABLED
# This adds EXPLICIT penalty for high attention in benign cases
# Works on top of the classification_gated_needle reward
rl_benign_sparsity_penalty_weight: 0.5  # Strong penalty for benign cases

# Optimizer configuration
optimizer: adamw
lr: 2.0e-05
encoder_lr: 8.0e-06
warmup_lr: 5.0e-05
cnn_lr: 1.0e-05
warmup_epochs: 1
wd: 0.01
epochs: 50  # More epochs to learn attention patterns
accumulate_grad_steps: 1
cutoff_epoch: null
scheduler: cosine

run_test: false
test_every_epoch: false
run_val: true

project: prostnfound_rl_v2
seed: 30
tracked_metric: val/core_auc_high_involvement

wandb:
 mode: online

save_checkpoint_wandb: false
torch_compile: false
use_amp: true
device: cuda
checkpoint_dir: checkpoints_rl_v2/${name}
model_checkpoint: null
debug: false
save_best_weights: true

evaluator:
 log_images: false
 log_images_every: 100
